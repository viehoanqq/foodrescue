name: CI

on:
  push:
    branches: ['**']          # push lên BẤT KỲ nhánh nào (feature/..., fix/..., develop, main) đều chạy CI
  pull_request:
    branches: [main, develop] # mở / cập nhật PR vào develop, main cũng chạy CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true    # push liên tiếp lên cùng nhánh thì huỷ lần chạy cũ, chỉ giữ lần mới nhất


jobs:
  services:
    name: Microservices (build + test)
    runs-on: ubuntu-latest

    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build và chạy test
        working-directory: services
        run: mvn -B verify

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài thư viện
        working-directory: frontend
        run: npm ci

      - name: Kiểm tra code (lint)
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build
        working-directory: frontend
        run: npm run build
