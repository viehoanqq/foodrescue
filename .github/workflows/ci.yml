name: CI

on:
  push:
    branches: ['**']          # push lên BẤT KỲ nhánh nào (feature/..., fix/..., develop, main) đều chạy CI
  pull_request:
    branches: [main, develop] # mở / cập nhật PR vào develop, main cũng chạy CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true    # push liên tiếp lên cùng nhánh thì huỷ lần chạy cũ, chỉ giữ lần mới nhất


jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Tạo CSDL từ foodrescue_schema.sql
        run: mysql -h 127.0.0.1 -uroot -proot --default-character-set=utf8mb4 < database/foodrescue_schema.sql

      - name: Kiểm tra dữ liệu mẫu (chênh lệch đối soát phải bằng 0)
        run: |
          DIFF=$(mysql -N -h 127.0.0.1 -uroot -proot --default-character-set=utf8mb4 < database/foodrescue_checks.sql | head -1 | awk '{print $NF}')
          echo "Chênh lệch đối soát: $DIFF"
          test "$DIFF" = "0"

      - name: Build và chạy test
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài thư viện
        working-directory: frontend
        run: npm ci

      - name: Kiểm tra code (lint)
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build
        working-directory: frontend
        run: npm run build