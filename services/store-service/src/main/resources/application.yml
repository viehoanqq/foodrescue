server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: store-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/store_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:foodrescue}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
outbox:
  poll-ms: ${OUTBOX_POLL_MS:1000}
app:
  upload-dir: ${STORE_UPLOAD_DIR:uploads}
  jwt:
    secret: ${JWT_SECRET:}
  internal-api-key: ${INTERNAL_API_KEY:}
  finance-store-api-key: ${FINANCE_STORE_API_KEY:}
  identity-service-url: ${IDENTITY_SERVICE_URL:http://identity-service:8082}
  order-service-url: ${ORDER_SERVICE_URL:http://order-service:8085}

