server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: store-service
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/store_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:foodrescue}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
management:
  endpoints:
    web:
      exposure:
        include: health,info

