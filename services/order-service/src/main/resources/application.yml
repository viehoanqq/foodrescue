server:
  port: ${SERVER_PORT:8085}
spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:foodrescue}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  internal-api-key: ${INTERNAL_API_KEY:}
  catalog-service-url: ${CATALOG_SERVICE_URL:http://catalog-inventory-service:8084}
  jwt:
    secret: ${JWT_SECRET:}
  identity-service-url: ${IDENTITY_SERVICE_URL:http://identity-service:8082}

