server:
  port: ${SERVER_PORT:8085}
spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123}
  flyway:
    enabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  internal-api-key: ${INTERNAL_API_KEY:z9AphlDPXMbCx5GrqRZBZ1-9nDJ7yX1VjzNLUOD7Z2euwvVWSbM0kroVJtruzSDV}
  catalog-service-url: ${CATALOG_SERVICE_URL:http://localhost:8084}
  store-service-url: ${STORE_SERVICE_URL:http://localhost:8083}
  jwt:
    secret: ${JWT_SECRET:3qCTqWepEe1ycaz_ge8zYdxG9okY9nQNVhMBU-jPJCcBgrffhw7dJlrfmE6s5wPW}
  identity-service-url: ${IDENTITY_SERVICE_URL:http://localhost:8082}
