server:
  port: ${SERVER_PORT:8085}
spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/order_db?serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:order_app}
    password: ${DB_PASSWORD:${ORDER_DB_PASSWORD:}}
  flyway:
    enabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:foodrescue}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  internal-api-key: ${INTERNAL_API_KEY:z9AphlDPXMbCx5GrqRZBZ1-9nDJ7yX1VjzNLUOD7Z2euwvVWSbM0kroVJtruzSDV}
  catalog-service-url: ${CATALOG_SERVICE_URL:http://localhost:8084}
  store-service-url: ${STORE_SERVICE_URL:http://localhost:8083}
  jwt:
    secret: ${JWT_SECRET:3qCTqWepEe1ycaz_ge8zYdxG9okY9nQNVhMBU-jPJCcBgrffhw7dJlrfmE6s5wPW}
  identity-service-url: ${IDENTITY_SERVICE_URL:http://localhost:8082}
