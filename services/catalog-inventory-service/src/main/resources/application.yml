server:
  port: ${SERVER_PORT:8084}
spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  application:
    name: catalog-inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/catalog_db}
    username: ${DB_USERNAME:catalog_app}
    password: ${DB_PASSWORD:${CATALOG_DB_PASSWORD:}}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:foodrescue}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  internal-api-key: ${INTERNAL_API_KEY:}
  jwt:
    secret: ${JWT_SECRET:}
  identity-service-url: ${IDENTITY_SERVICE_URL:http://localhost:8082}

