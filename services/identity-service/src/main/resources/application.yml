server:
  port: ${SERVER_PORT:8082}
spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/identity_db?serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:identity_app}
    password: ${DB_PASSWORD:${IDENTITY_DB_PASSWORD:}}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${SMTP_HOST:smtp81196.bkns.com.vn}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:foodrescue}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  otp:
    secret: ${OTP_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: 24
  internal-api-key: ${INTERNAL_API_KEY:}
  seed:
    enabled: ${SEED_ACCOUNTS_ENABLED:false}
    admin:
      email: ${SEED_ADMIN_EMAIL:}
      password: ${SEED_ADMIN_PASSWORD:}
    owner:
      email: ${SEED_OWNER_EMAIL:}
      password: ${SEED_OWNER_PASSWORD:}

