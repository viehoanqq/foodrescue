server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: identity-api
          uri: ${IDENTITY_SERVICE_URL:http://identity-service:8082}
          predicates:
            - Path=/api/auth/register,/api/auth/login,/api/me,/api/me/**,/api/admin/users,/api/admin/users/**,/api/admin/audit-logs,/api/admin/audit-logs/**
app:
  jwt:
    secret: ${JWT_SECRET:}
  internal-api-key: ${INTERNAL_API_KEY:}
  health:
    identity-url: ${IDENTITY_SERVICE_URL:http://identity-service:8082}
    store-url: ${STORE_SERVICE_URL:http://store-service:8083}
    catalog-url: ${CATALOG_SERVICE_URL:http://catalog-inventory-service:8084}
    order-url: ${ORDER_SERVICE_URL:http://order-service:8085}
    finance-url: ${FINANCE_SERVICE_URL:http://payment-finance-service:8086}
management:
  endpoints:
    web:
      exposure:
        include: health,info
