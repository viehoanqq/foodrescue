# Cấu hình chung (commit lên Git). Mật khẩu, key để trong application-local.yml (KHÔNG commit).
spring:
  config:
    import: optional:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/foodrescuedb?serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                  # bảng tạo từ foodrescue_schema.sql, KHÔNG để Hibernate tự tạo
    properties:
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false    # LocalDateTime -> "2026-09-25T21:00:00"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:./uploads}
  jwt:
    secret: ${JWT_SECRET:doi-chuoi-nay-trong-application-local-yml-toi-thieu-32-ky-tu}
    expiration-hours: 24
  dev-auth:
    enabled: ${DEV_AUTH_ENABLED:true}                        # Bật trên máy dev để hỗ trợ X-Dev-User-Id
  order:
    payment-link-minutes: 10              # vnp_ExpireDate
    expire-after-minutes: 15              # tác vụ huỷ đơn chưa thanh toán
    pickup-grace-minutes: 30              # NO_SHOW sau pickup_end + 30 phút
    max-quantity-per-item: 5
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: ${app.frontend-url}/payment/result
  map:
    osrm-url: ${OSRM_URL:http://router.project-osrm.org}
    timeout-ms: 2000
    road-factor-fallback: 1.3
